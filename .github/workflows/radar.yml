name: Shanghai activity radar

on:
  workflow_dispatch:
  schedule:
    # Monday 08:00 Asia/Shanghai = Monday 00:00 UTC.
    - cron: "0 0 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  research-and-publish:
    runs-on: ubuntu-latest
    env:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      CODEX_BASE_URL: ${{ vars.CODEX_BASE_URL }}
      RADAR_MODEL: ${{ vars.RADAR_MODEL || 'gpt-5.5' }}
      RADAR_PUSH_TARGET: weixin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install .
      - name: Verify Codex API key is configured
        run: test -n "$CODEX_API_KEY"
      - name: Run research and render
        run: radar run --live
      - name: Commit radar history and timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs site
          git diff --cached --quiet || git commit -m "chore: update Shanghai activity radar"
          git push
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: research-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
