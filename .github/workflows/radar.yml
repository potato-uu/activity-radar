name: Shanghai activity radar

on:
  workflow_dispatch:
  schedule:
    # Sunday 16:00 Asia/Shanghai = Sunday 08:00 UTC (full).
    - cron: "0 8 * * 0"
    # Wednesday 08:00 Asia/Shanghai = Wednesday 00:00 UTC (delta).
    - cron: "0 0 * * 3"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  research-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      CODEX_BASE_URL: ${{ vars.CODEX_BASE_URL }}
      RADAR_MODEL: ${{ vars.RADAR_MODEL || 'gpt-5.5' }}
      RADAR_PUSH_TARGET: weixin
      RADAR_SOURCE_TIMEOUT_SECONDS: "180"
      RADAR_SOURCE_RETRIES: "2"
      RADAR_DISCOVERY_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install .
      - run: python -m playwright install --with-deps chromium
      - name: Verify Codex API key is configured
        run: test -n "$CODEX_API_KEY"
      - name: Select push mode
        id: push-mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 0 * * 3" ]; then
            echo "mode=delta" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi
      - name: Run research and render
        run: radar run --live --push-mode "${{ steps.push-mode.outputs.mode }}"
      - name: Commit radar history and timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs site
          git diff --cached --quiet || git commit -m "chore: update Shanghai activity radar"
          git push
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: research-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
