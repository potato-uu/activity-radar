<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>上海 BD 活动雷达</title><style>
:root { color-scheme: light; --ink:#17202a; --muted:#66717c; --line:#dce2e7; --blue:#2166d1; --green:#177245; --amber:#986500; --red:#a52a2a; }
* { box-sizing:border-box; } body { margin:0; font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:#f7f9fb; }
main { max-width:1040px; margin:0 auto; padding:32px 20px 64px; } header { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; border-bottom:1px solid var(--line); padding-bottom:20px; }
h1 { margin:0; font-size:28px; } h2 { margin:28px 0 10px; font-size:19px; } .updated { color:var(--muted); font-size:13px; }
.filters { display:flex; flex-wrap:wrap; gap:8px; margin:20px 0; } select { border:1px solid var(--line); border-radius:6px; background:white; padding:8px 10px; color:var(--ink); }
.event { display:grid; grid-template-columns:140px 1fr; gap:18px; padding:16px 0; border-top:1px solid var(--line); } .date { color:var(--muted); font-variant-numeric:tabular-nums; }
h3 { margin:0 0 5px; font-size:18px; } h3 a { color:var(--ink); } .meta { color:var(--muted); margin:0 0 9px; } .badges { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.badges span { display:inline-block; border:1px solid var(--line); border-radius:4px; padding:2px 7px; font-size:12px; background:white; } .tier-A { border-color:#c34b4b !important; color:var(--red); } .tier-B { border-color:#c69827 !important; color:var(--amber); } .acquisition { color:var(--blue); } .ecosystem { color:var(--green); }
@media(max-width:640px) { header { display:block; } .event { grid-template-columns:1fr; gap:4px; } }
</style></head><body><main><header><div><h1>上海 BD 活动雷达</h1><div class="updated">未来视图 · 生成于 2026-08-16T10:32:47+00:00</div></div></header>
<div class="filters"><select id="tier"><option value="">全部 Tier</option><option>A</option><option>B</option><option>C</option></select><select id="type"><option value="">全部类型</option><option>展会</option><option>峰会</option><option>沙龙</option><option>开发者大会</option><option>webinar</option></select><select id="line"><option value="">全部线别</option><option value="acq">获客线 >= 6</option><option value="eco">资源线 >= 6</option></select></div>
<div id="events"><p>暂无符合条件的活动。</p></div></main><script>
const apply=()=>{const tier=document.querySelector('#tier').value,type=document.querySelector('#type').value,line=document.querySelector('#line').value;document.querySelectorAll('.event').forEach(e=>{const ok=(!tier||e.dataset.tier===tier)&&(!type||e.dataset.type===type)&&(!line||(line==='acq'?+e.dataset.acq>=6:+e.dataset.eco>=6));e.hidden=!ok;})};document.querySelectorAll('select').forEach(x=>x.addEventListener('change',apply));
</script></body></html>
